<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simone Kowal | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Variables & Reset */
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --accent-blue: #0A1931;
            --highlight-blue: #150E56;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 300;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #4da8da;
        }

        /* Hero Section */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-color) 40%, var(--accent-blue) 100%);
            padding: 0 20px;
        }

        header h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease-out;
        }

        header p {
            font-size: 1.2rem;
            font-weight: 300;
            max-width: 600px;
            color: #cccccc;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        /* Content Sections */
        section {
            padding: 100px 10%;
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--highlight-blue);
            display: inline-block;
            padding-bottom: 10px;
        }

        /* Grid Layout for Cards */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Styling the Cards */
        .card {
            background-color: var(--accent-blue);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(21, 14, 86, 0.8);
            background-color: var(--highlight-blue);
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .card p {
            font-size: 0.95rem;
            color: #b3b3b3;
            margin-bottom: 20px;
        }

        /* Spotify Embed Styling */
        iframe {
            margin-top: auto; /* Pushes the embed to the bottom of the card */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

            text-align: center;
            padding: 30px;
            background-color
